version: "3.9"

# ============================================================
# Cidades ESG Inteligentes - Docker Compose
# Uso: docker compose --profile staging up -d
#      docker compose --profile prod up -d
# ============================================================

networks:
  esg-network:
    driver: bridge

volumes:
  sqlserver-data:
  sqlserver-data-prod:

services:

  # ----------------------------------------------------------
  # SQL Server - Staging
  # ----------------------------------------------------------
  sqlserver-staging:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["staging"]
    container_name: esg-sqlserver-staging
    environment:
      SA_PASSWORD: ${DB_PASSWORD:-Esg@Staging2024}
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - esg-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P ${DB_PASSWORD:-Esg@Staging2024} -Q 'SELECT 1' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------
  # Aplicação Spring Boot - Staging
  # ----------------------------------------------------------
  app-staging:
    image: ${DOCKER_IMAGE:-esg-cidades-inteligentes}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["staging"]
    container_name: esg-app-staging
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver-staging:1433;databaseName=${DB_NAME:-esg_staging};encrypt=false;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-sa}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-Esg@Staging2024}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      sqlserver-staging:
        condition: service_healthy
    networks:
      - esg-network
    restart: on-failure

  # ----------------------------------------------------------
  # SQL Server - Produção
  # ----------------------------------------------------------
  sqlserver-prod:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["prod"]
    container_name: esg-sqlserver-prod
    environment:
      SA_PASSWORD: ${DB_PASSWORD_PROD:?Defina DB_PASSWORD_PROD no .env}
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    ports:
      - "1434:1433"
    volumes:
      - sqlserver-data-prod:/var/opt/mssql
    networks:
      - esg-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P ${DB_PASSWORD_PROD} -Q 'SELECT 1' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------
  # Aplicação Spring Boot - Produção
  # ----------------------------------------------------------
  app-prod:
    image: ${DOCKER_IMAGE:-esg-cidades-inteligentes}:${IMAGE_TAG:-latest}
    profiles: ["prod"]
    container_name: esg-app-prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver-prod:1433;databaseName=${DB_NAME_PROD:-esg_prod};encrypt=false;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER_PROD:-sa}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_PROD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SERVER_PORT: 8080
    ports:
      - "8081:8080"
    depends_on:
      sqlserver-prod:
        condition: service_healthy
    networks:
      - esg-network
    restart: always
